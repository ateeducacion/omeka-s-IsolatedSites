services:

  omekas:
    image: erseco/alpine-omeka-s:4.2
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_HOST: mariadb
      DB_NAME: omeka
      DB_USER: omeka
      DB_PASSWORD: omeka
      DB_PORT: 3306

      # Core install. The container ignores the blueprint's `install`, so keep
      # these in line with blueprint.json (an existing admin is never changed).
      OMEKA_ADMIN_EMAIL: admin@example.com
      OMEKA_ADMIN_NAME: admin
      OMEKA_ADMIN_PASSWORD: password
      OMEKA_SITE_TITLE: "IsolatedSites Playground"
      OMEKA_LOCALE: es
      OMEKA_TIMEZONE: Atlantic/Canary

      # The same blueprint.json as Omeka S Playground (modules incl. Impersonate, the demo users,
      # the two sites and their permissions), re-applied on every start. Playground-only bits
      # (x-playground) are ignored.
      OMEKA_BLUEPRINT: /var/www/html/volume/modules/IsolatedSites/blueprint.json
      # Keep the stack up if the blueprint fails (e.g. no network), instead of a restart loop
      OMEKA_BLUEPRINT_ON_ERROR: warn
      # App environment and base URL
      APPLICATION_ENV: development
      SITE_URL: http://localhost:8080

      # Dev tools only: IsolatedSites and Impersonate come from the blueprint
      OMEKA_THEMES: "default"
      OMEKA_MODULES: |
        Common
        EasyAdmin
        Adminer
        Log

      POST_CONFIGURE_COMMANDS: |
        # Omeka-S-Cli applies the blueprint's modules, users, sites and permissions, but not
        # its per-user settings, item sets and items: this idempotent script applies those
        # from the same blueprint.json, so Docker gets the Playground's demo. See data/provision-demo.php.
        php /var/www/html/volume/modules/IsolatedSites/data/provision-demo.php || true

    volumes:
      - omekas_data:/var/www/html/volume:Z
      - ./:/var/www/html/volume/modules/IsolatedSites

  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: omeka
      MYSQL_DATABASE: omeka
      MYSQL_USER: omeka
      MYSQL_PASSWORD: omeka
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-homariadb", "-uomeka", "-pomeka"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
  omekas_data:
